name: Terraform Plan

on:
  pull_request:
    paths:
      - "infrastructure/**"

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  TERRAFORM_VERSION: "1.9.0"

jobs:
  plan-stg:
    name: Plan Staging
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Terraform Init (stg)
        working-directory: infrastructure/environments/20_stg
        run: |
          terraform init \
            -backend-config="bucket=${{ env.PROJECT_ID }}-tfstate-stg"

      - name: Terraform Plan (stg)
        id: plan_stg
        working-directory: infrastructure/environments/20_stg
        run: terraform plan -no-color 2>&1 | tee /tmp/plan_stg.txt
        continue-on-error: true

      - name: Comment Plan (stg)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('/tmp/plan_stg.txt', 'utf8');
            const body = plan.length > 60000
              ? plan.substring(0, 60000) + '\n...(truncated)'
              : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan - Staging\n\`\`\`terraform\n${body}\n\`\`\``
            });

  plan-prod:
    name: Plan Production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Terraform Init (prod)
        working-directory: infrastructure/environments/30_prod
        run: |
          terraform init \
            -backend-config="bucket=${{ env.PROJECT_ID }}-tfstate-prod"

      - name: Terraform Plan (prod)
        id: plan_prod
        working-directory: infrastructure/environments/30_prod
        run: terraform plan -no-color 2>&1 | tee /tmp/plan_prod.txt
        continue-on-error: true

      - name: Comment Plan (prod)
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('/tmp/plan_prod.txt', 'utf8');
            const body = plan.length > 60000
              ? plan.substring(0, 60000) + '\n...(truncated)'
              : plan;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Terraform Plan - Production\n\`\`\`terraform\n${body}\n\`\`\``
            });
